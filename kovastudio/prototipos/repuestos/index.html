
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso al sistema | Nakamura Crest Parts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-pZfN6UxqA2Z3V7PpcH5jH+gQ3m1qAgCM1Bzxw4ZXmpxgC0xXf6QkA9sW5YtK7fW9J4N5j7zQQzDk3rN7YzMZxgw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-6">
    <div class="w-full max-w-md rounded-3xl bg-slate-900 border border-slate-800 p-8 shadow-2xl">
        <div class="mb-8 text-center">
            <div class="mx-auto mb-4 flex h-24 w-24 items-center justify-center overflow-hidden rounded-3xl border border-slate-700 bg-slate-950 shadow-lg">
                <img src="assets/minibus-logo.svg" alt="Logo de minibus" class="h-full w-full object-contain" />
            </div>
            <h1 class="text-3xl font-extrabold">Nakamura Crest Parts</h1>
            <p class="mt-2 text-slate-400">Acceso seguro al sistema de inventario y facturación</p>
        </div>

        

        <form method="post" action="index.html" novalidate class="space-y-5">
            
            <div class="rounded-2xl border border-slate-700 bg-slate-950 p-4">
                <label class="block text-sm font-semibold text-slate-300 mb-2" for="username">Usuario / Código de acceso</label>
                <input
                    type="text"
                    name="username"
                    id="username"
                    value="admin"
                    autocomplete="username"
                    pattern="[A-Za-z0-9_.@+-]+"
                    title="Letras, números y . _ @ + - solamente"
                    required
                    class="w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
            </div>

            <div class="rounded-2xl border border-slate-700 bg-slate-950 p-4 relative">
                <label class="block text-sm font-semibold text-slate-300 mb-2" for="password">Contraseña</label>
                <input
                    type="password"
                    name="password"
                    id="password"
                    autocomplete="current-password"
                    required
                    class="w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <button type="button" id="togglePassword" class="absolute right-4 top-12 text-slate-400 hover:text-slate-100">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <div class="flex items-center justify-between text-sm text-slate-400">
                <label class="inline-flex items-center gap-2">
                    <input type="checkbox" name="remember_me" class="h-4 w-4 rounded border-slate-600 bg-slate-900 text-blue-500 focus:ring-blue-500" />
                    Recordar usuario
                </label>
            </div>

            <input type="hidden" name="initial_admin" value="1" />
            

            <button type="submit" class="w-full rounded-2xl bg-blue-600 px-4 py-3 font-semibold text-white hover:bg-blue-500">Ingresar al sistema</button>
        </form>

        <div class="mt-8 border-t border-slate-800 pt-6">
            <h2 class="text-lg font-semibold text-slate-100">Crear cuenta</h2>
            <p class="mt-1 text-sm text-slate-400">Puedes registrar tu usuario aquí. Si no existe un administrador, esta cuenta será el administrador principal.</p>
            <form method="post" action="#" novalidate class="mt-4 space-y-4">
                
                <div class="rounded-2xl border border-slate-700 bg-slate-950 p-4">
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Usuario</label>
                    <input type="text" name="username" required class="w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div class="rounded-2xl border border-slate-700 bg-slate-950 p-4">
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Contraseña</label>
                    <input type="password" name="password" required class="w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div class="rounded-2xl border border-slate-700 bg-slate-950 p-4">
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Confirmar contraseña</label>
                    <input type="password" name="password_confirm" required class="w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <label class="inline-flex items-center gap-2 text-sm text-slate-300">
                    <input type="checkbox" name="make_admin" class="h-4 w-4 rounded border-slate-600 bg-slate-900 text-blue-500 focus:ring-blue-500"  />
                    Crear como administrador
                </label>
                <button type="submit" class="w-full rounded-2xl bg-emerald-600 px-4 py-3 font-semibold text-white hover:bg-emerald-500">Crear cuenta</button>
            </form>
        </div>

        <div class="mt-6 text-center text-xs text-slate-500">
            <p>Versión 1.0 · 2026</p>
        </div>
    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.innerHTML = type === 'password' ? '<i class="fa-solid fa-eye"></i>' : '<i class="fa-solid fa-eye-slash"></i>';
        });
    </script>
<div style="position:fixed;left:12px;bottom:12px;z-index:9999;background:rgba(15,23,42,.92);color:#93c5fd;border:1px solid #1e3a8a;padding:5px 12px;border-radius:999px;font:600 11px system-ui">PROTOTIPO VISUAL · datos de ejemplo</div>
<script>document.addEventListener('submit',function(e){e.preventDefault();var l=!!document.querySelector('input[type=password]')&&!document.querySelector('table');if(l){location.href='dashboard.html';return}
var t=document.createElement('div');t.textContent='Prototipo visual: esta acción no está activa';t.style.cssText='position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1d4ed8;color:#fff;padding:10px 18px;border-radius:10px;font:600 13px system-ui;z-index:9999';document.body.appendChild(t);setTimeout(function(){t.remove()},2200)},true);</script></body>
</html>
