<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TicketPro RD — Prototipo visual</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0612;--card:#150d24;--line:#2a1d44;--tx:#f5f0ff;--mu:#a597c4;--hot:#ff3d71;--gold:#ffb84d;--ok:#3ddc97}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,h3,.logo{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.03em}
button{font:inherit;cursor:pointer;border:0;color:inherit}
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:rgba(10,6,18,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-size:1.9rem}.logo b{color:var(--hot);font-weight:400}
.cartbtn{background:var(--card);border:1px solid var(--line);padding:9px 16px;border-radius:99px;font-weight:700}
.cartbtn span{background:var(--hot);border-radius:99px;padding:1px 8px;margin-left:6px;font-size:.8rem}
.hero{margin:22px 5vw;border-radius:22px;padding:clamp(28px,6vw,64px);position:relative;overflow:hidden;background:radial-gradient(circle at 85% 20%,#ff3d7155,transparent 45%),radial-gradient(circle at 10% 90%,#7b2ff755,transparent 50%),#150d24;border:1px solid var(--line)}
.hero small{color:var(--gold);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.75rem}
.hero h1{font-size:clamp(3rem,10vw,6.4rem);line-height:.92;margin:10px 0 14px}
.hero p{color:var(--mu);max-width:480px;margin-bottom:22px}
.btn{background:var(--hot);padding:12px 24px;border-radius:12px;font-weight:700;transition:.2s}.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn.alt{background:transparent;border:1px solid var(--line)}
main{padding:0 5vw 70px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0 20px}
.chip{background:var(--card);border:1px solid var(--line);padding:8px 18px;border-radius:99px;color:var(--mu);font-weight:500}
.chip.on{background:var(--tx);color:#150d24;border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.2s}.ev:hover{transform:translateY(-4px);border-color:var(--hot)}
.art{height:130px;display:flex;align-items:flex-end;padding:14px;font-size:2.4rem;font-family:'Bebas Neue';line-height:1}
.ev .in{padding:16px}.ev small{color:var(--mu)}.ev h3{font-size:1.5rem;margin:2px 0 8px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.price{color:var(--gold);font-weight:700}
#panel{margin-top:44px;display:none;grid-template-columns:1fr 340px;gap:26px}
#panel.show{display:grid}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.stage{background:linear-gradient(#ff3d7133,transparent);border-top:3px solid var(--hot);text-align:center;padding:8px;color:var(--mu);letter-spacing:.4em;font-size:.72rem;margin:14px 0 20px;border-radius:6px 6px 0 0}
.seats{display:grid;gap:8px;overflow-x:auto;padding-bottom:6px}
.sr{display:flex;gap:6px;align-items:center;justify-content:center}.sr i{width:20px;color:var(--mu);font-style:normal;font-size:.75rem}
.s{width:26px;height:26px;border-radius:7px 7px 4px 4px;background:var(--c);opacity:.85;flex:none}.s:hover{opacity:1;transform:scale(1.12)}
.s.x{background:#2a2142;opacity:.5;cursor:not-allowed}.s.sel{background:#fff;box-shadow:0 0 0 2px var(--hot)}
.leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;color:var(--mu);font-size:.82rem}.leg b{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ln{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.9rem}.ln span:last-child{color:var(--gold)}
.tot{font-size:1.3rem;font-weight:700;display:flex;justify-content:space-between;margin:14px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--tx);color:#150d24;padding:11px 20px;border-radius:12px;font-weight:700;z-index:40;font-size:.88rem}
.tag{position:fixed;left:12px;bottom:12px;background:#150d24ee;border:1px solid var(--line);color:var(--mu);padding:5px 12px;border-radius:99px;font-size:.7rem;font-weight:700;z-index:30}
@media(max-width:820px){#panel.show{grid-template-columns:1fr}.logo{font-size:1.5rem}}
</style>
</head>
<body>
<header>
  <div class="logo">Ticket<b>Pro</b> RD</div>
  <button class="cartbtn" onclick="document.getElementById('panel').scrollIntoView({behavior:'smooth'})">🎫 Mis boletos<span id="cnt">0</span></button>
</header>

<section class="hero">
  <small>Evento destacado · 12 dic 2026</small>
  <h1>Noche Urbana<br>Santo Domingo</h1>
  <p>Los mejores artistas urbanos en una sola noche. Elige tu asiento y compra en menos de un minuto.</p>
  <button class="btn" onclick="open_(0)">Comprar boletos</button>
  <button class="btn alt" onclick="document.getElementById('lista').scrollIntoView({behavior:'smooth'})">Ver cartelera</button>
</section>

<main>
  <div class="chips" id="chips"></div>
  <div class="grid" id="lista"></div>

  <section id="panel">
    <div class="box">
      <h2 id="pt" style="font-size:2rem"></h2>
      <small id="pd" style="color:var(--mu)"></small>
      <div class="stage">ESCENARIO</div>
      <div class="seats" id="seats"></div>
      <div class="leg" id="leg"></div>
    </div>
    <aside class="box" style="align-self:start;position:sticky;top:84px">
      <h3 style="font-size:1.5rem;margin-bottom:8px">Tu selección</h3>
      <div id="cart"><p style="color:var(--mu)">Toca un asiento disponible para agregarlo.</p></div>
      <div class="tot"><span>Total</span><span id="tot">RD$ 0</span></div>
      <button class="btn" style="width:100%" onclick="toast('Prototipo visual: el pago no está activo')">Pagar ahora</button>
    </aside>
  </section>
</main>
<div class="tag">PROTOTIPO VISUAL · datos de ejemplo</div>

<script>
const EV=[
 {n:'Noche Urbana Santo Domingo',c:'Conciertos',d:'12 dic · 9:00 pm',v:'Arena Santo Domingo',p:[3500,2200,1500],g:'linear-gradient(135deg,#ff3d71,#7b2ff7)'},
 {n:'Torneo Nacional de Béisbol',c:'Deportes',d:'20 dic · 7:30 pm',v:'Estadio Quisqueya',p:[2000,1100,600],g:'linear-gradient(135deg,#00b4d8,#0077b6)'},
 {n:'El Último Tren',c:'Teatro',d:'18 dic · 8:00 pm',v:'Teatro Nacional',p:[2800,1800,1200],g:'linear-gradient(135deg,#ffb84d,#e5383b)'},
 {n:'Fiesta del Merengue',c:'Festivales',d:'27 dic · 5:00 pm',v:'Malecón Center',p:[1800,1000,500],g:'linear-gradient(135deg,#3ddc97,#118ab2)'},
 {n:'Bachata Sinfónica',c:'Conciertos',d:'8 ene · 8:30 pm',v:'Teatro Nacional',p:[3200,2000,1400],g:'linear-gradient(135deg,#9d4edd,#ff4d6d)'},
 {n:'Clásico del Baloncesto',c:'Deportes',d:'15 ene · 7:00 pm',v:'Palacio de los Deportes',p:[1900,1200,700],g:'linear-gradient(135deg,#ff7b00,#d00000)'}];
const COL=['#ffb84d','#ff3d71','#7b9bff'],ZN=['VIP','Preferencial','General'],R='ABCDEFGH';
let cur=0,cat='Todos',cart=[];
const $=id=>document.getElementById(id),fmt=n=>'RD$ '+n.toLocaleString('es-DO');
const zone=r=>r<2?0:r<5?1:2;
const taken=(e,r,s)=>((e*7+r*13+s*17+r*s)%5===0);
function chips(){$('chips').innerHTML=['Todos','Conciertos','Deportes','Teatro','Festivales'].map(c=>`<button class="chip ${c===cat?'on':''}" onclick="cat='${c}';chips();list()">${c}</button>`).join('')}
function list(){$('lista').innerHTML=EV.map((e,i)=>e.c===cat||cat==='Todos'?`<article class="ev"><div class="art" style="background:${e.g}">${e.c}</div><div class="in"><small>${e.d} · ${e.v}</small><h3>${e.n}</h3><div class="row"><span class="price">Desde ${fmt(e.p[2])}</span><button class="btn" style="padding:8px 16px" onclick="open_(${i})">Comprar</button></div></div></article>`:'').join('')}
function open_(i){cur=i;$('panel').classList.add('show');draw();$('panel').scrollIntoView({behavior:'smooth'})}
function draw(){const e=EV[cur];$('pt').textContent=e.n;$('pd').textContent=e.d+' · '+e.v;
 $('seats').innerHTML=[...R].map((l,r)=>`<div class="sr"><i>${l}</i>`+Array.from({length:12},(_,s)=>{const id=cur+l+(s+1),x=taken(cur,r,s),on=cart.some(c=>c.id===id);
  return `<button class="s ${x?'x':''} ${on?'sel':''}" style="--c:${COL[zone(r)]}" ${x?'disabled':''} title="${l}${s+1} · ${fmt(e.p[zone(r)])}" onclick="pick('${id}',${r},'${l}${s+1}')"></button>`}).join('')+'</div>').join('');
 $('leg').innerHTML=ZN.map((z,i)=>`<span><b style="background:${COL[i]}"></b>${z} ${fmt(e.p[i])}</span>`).join('')+'<span><b style="background:#2a2142"></b>Ocupado</span><span><b style="background:#fff"></b>Tu selección</span>';render()}
function pick(id,r,name){const k=cart.findIndex(c=>c.id===id);k>-1?cart.splice(k,1):cart.push({id,name,ev:EV[cur].n,price:EV[cur].p[zone(r)]});draw()}
function render(){$('cnt').textContent=cart.length;const t=cart.reduce((a,c)=>a+c.price,0);
 $('cart').innerHTML=cart.length?cart.map(c=>`<div class="ln"><span>${c.name} · ${c.ev}</span><span>${fmt(c.price)}</span></div>`).join('')+`<div class="ln"><span>ITBIS incluido (18%)</span><span>${fmt(Math.round(t-t/1.18))}</span></div>`:'<p style="color:var(--mu)">Toca un asiento disponible para agregarlo.</p>';
 $('tot').textContent=fmt(t)}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
chips();list();
</script>
</body>
</html>
